global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: aiops-backend
    static_configs:
      - targets: ['backend:5000']

  - job_name: aiops-ml-service
    static_configs:
      - targets: ['ml-service:8000']
