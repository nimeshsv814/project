apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiops-ingress
  namespace: aiops
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  rules:
    - host: aiops.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aiops-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aiops-frontend
                port:
                  number: 80
