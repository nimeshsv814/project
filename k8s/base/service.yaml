apiVersion: v1
kind: Service
metadata:
  name: aiops-backend
  namespace: aiops
spec:
  selector:
    app: aiops-backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-frontend
  namespace: aiops
spec:
  selector:
    app: aiops-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-ml-service
  namespace: aiops
spec:
  selector:
    app: aiops-ml-service
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
