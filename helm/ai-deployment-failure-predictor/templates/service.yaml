apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ include "aiops.fullname" . }}-backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ include "aiops.fullname" . }}-frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops.fullname" . }}-ml-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ include "aiops.fullname" . }}-ml-service
  ports:
    - port: {{ .Values.mlService.service.port }}
      targetPort: {{ .Values.mlService.service.port }}
  type: ClusterIP
